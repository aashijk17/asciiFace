<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII Face Camera</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="camera-window" aria-label="ASCII face camera">
        <div class="camera-frame" aria-live="polite">
          <video id="video" autoplay playsinline muted></video>
          <pre id="asciiOutput" aria-label="Live ASCII face output"></pre>
          <div id="cameraControls" class="controls">
            <button id="startButton" type="button">Start camera</button>
            <button id="stopButton" type="button" disabled>Stop</button>
            <p id="status" class="status" role="status">
              Start the camera to see your face as ASCII.
            </p>
          </div>
        </div>
        <canvas id="sourceCanvas" aria-hidden="true"></canvas>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
